name: Update SMBC China Monthly RSS

on:
  schedule:
    # 毎週金曜日 13:00 JST (UTC 4:00)
    - cron: '0 4 * * 5'
  workflow_dispatch:
    # 手動実行も可能に

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Chromeをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
      
      - name: ChromeDriverのパスを設定
        run: |
          echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
          echo "CHROME_DRIVER=/usr/bin/chromedriver" >> $GITHUB_ENV
      
      - name: RSSフィードを生成
        run: |
          python generate_rss.py
      
      - name: 変更をコミット
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add smbc_china_monthly.xml
          git diff --staged --quiet || git commit -m "自動更新: SMBC China Monthly RSS ($(date '+%Y-%m-%d'))"
      
      - name: 変更をプッシュ
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
