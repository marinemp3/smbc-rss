name: Update SMBC China Monthly RSS

on:
  schedule:
    # 毎週金曜日 13:00 JST (UTC 4:00)
    - cron: '0 4 * * 5'
  workflow_dispatch:

# 権限を明示的に設定
permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          # トークンを明示的に指定
          token: ${{ secrets.GITHUB_TOKEN }}
          # プッシュ用に設定
          persist-credentials: true
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0
      
      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: RSSフィードを生成
        run: |
          python generate_rss.py
      
      - name: 変更をコミット
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add smbc_china_monthly.xml
          git diff --staged --quiet || git commit -m "自動更新: SMBC China Monthly RSS ($(date '+%Y-%m-%d'))"
      
      - name: 変更をプッシュ
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          force: false
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
